name: source-ci
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: profile-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@7625c9c29c703d7492e0c04ff9c330e588ff1b09
        with:
          capability: security
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@7625c9c29c703d7492e0c04ff9c330e588ff1b09
        with:
          contract: .github/nddev-pr.toml
          result-key: pr-gate
          upload: failure
