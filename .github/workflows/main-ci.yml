name: main-ci
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: profile-main
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@45b3d760e5aea1eb9b45e9f8ab7de48446b61fa8
        with:
          capability: security
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@45b3d760e5aea1eb9b45e9f8ab7de48446b61fa8
        env:
          GITHUB_TOKEN: ${{ github.token }}
